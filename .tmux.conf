# 🚀 Multi-Agent 開発用 tmux設定

# 基本設定
set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g escape-time 0

# マウス操作有効化（デフォルト）
set -g mouse on

# ペイン分割のキーバインド
bind | split-window -h
bind - split-window -v

# ペイン移動（Vimライク）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ウィンドウ番号を1から開始
set -g base-index 1
set -g pane-base-index 1

# ステータスバー設定
set -g status-bg colour235
set -g status-fg colour136
set -g status-left '#[fg=colour196]#S #[fg=colour244]| '
set -g status-right '#[fg=colour244]%Y-%m-%d %H:%M'

# ペインタイトル表示
set -g pane-border-status top
set -g pane-border-format '#[fg=colour245] #{pane_title} '

# アクティブペイン強調
set -g pane-active-border-style fg=colour76

# セッション保存・復元（tmux-resurrect対応）
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# プラグイン設定（必要に応じて）
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# run '~/.tmux/plugins/tpm/tpm'